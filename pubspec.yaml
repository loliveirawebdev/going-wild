    - lib/content/character/enemies/owl/atlas.json
    - lib/content/character/enemies/rat/atlas.webp
    - lib/content/character/enemies/rat/atlas.json
    - lib/content/character/enemies/skunk/atlas.webp
    - lib/content/character/enemies/skunk/atlas.json
    - lib/content/character/enemies/snake/atlas.webp
    - lib/content/character/enemies/snake/atlas.json
    - lib/content/character/team/bull/atlas.webp
    - lib/content/character/team/bull/atlas.json
    - lib/content/character/team/cat/atlas.webp
    - lib/content/character/team/cat/atlas.json
