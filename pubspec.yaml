name: going_wild
version: 0.1.0+1
publish_to: 'none'
description: "Going Wild"

environment:
  sdk: ^3.13.2

dependencies:
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  go_router: ^18.0.1
  meta: ^1.19.0
  shared_preferences: ^2.5.5
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  talker_bloc_logger: ^5.1.20
  talker_flutter: ^5.1.20

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.10.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/glyphs/
    - assets/avatars/
    - assets/headshots/
    - assets/brand/
    - assets/roles/
    - assets/effects/
    - assets/sets/
    - assets/scenes/
    - lib/content/phase/backyard/cover.jpg
    - lib/content/phase/pond_edge/cover.jpg
    - lib/content/phase/cornfield/cover.jpg
    - lib/content/character/enemies/alligator/atlas.webp
    - lib/content/character/enemies/alligator/atlas.json
    - lib/content/character/enemies/bat/atlas.webp
    - lib/content/character/enemies/bat/atlas.json
    - lib/content/character/enemies/bear/atlas.webp
    - lib/content/character/enemies/bear/atlas.json
    - lib/content/character/enemies/boar/atlas.webp
    - lib/content/character/enemies/boar/atlas.json
    - lib/content/character/enemies/cerberus/atlas.webp
    - lib/content/character/enemies/cerberus/atlas.json
    - lib/content/character/enemies/dragon/atlas.webp
    - lib/content/character/enemies/dragon/atlas.json
    - lib/content/character/enemies/fox/atlas.webp
    - lib/content/character/enemies/fox/atlas.json
    - lib/content/character/enemies/giant_spider/atlas.webp
    - lib/content/character/enemies/giant_spider/atlas.json
    - lib/content/character/enemies/hawk/atlas.webp
